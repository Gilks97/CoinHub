version: "3.9"

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

# ── Django + Gunicorn ────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    # This keeps your exact user ID mappings intact across Podman storage namespaces
    userns: keep-id
    volumes:
      - static_volume:/app/staticfiles:Z
      - media_volume:/app/media:Z
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"      
    expose:
      - "8000"

  # ── Nginx (reverse proxy + frontend) ─────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    links:
      - web:web
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./frontend:/usr/share/nginx/html:ro,z
      - static_volume:/app/staticfiles:ro,z
      - media_volume:/app/media:ro,z
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
